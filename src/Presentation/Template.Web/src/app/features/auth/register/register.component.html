<div class="register-container">
  <h2>Register</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onRegister()">

    <app-form-field  formControlName="name" label="Name"/>
    <app-form-field  formControlName="email" label="Email"/>
    <app-form-field  formControlName="password" label="Password"  type="password"/>
    <app-form-field  formControlName="confirmPassword" label="Confirm Password" type="password"/>

    <button type="submit" class="mt-3" [disabled]="registerForm.invalid">Register</button>
  </form>

  <div class="auth-options">
    <a routerLink="/login">Already have an account? Login</a>
  </div>
</div>
