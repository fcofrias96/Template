<div class="forgot-password-container d-flex justify-content-center align-items-center">
  <div class="forgot-password-content">
    <mat-card>
      <mat-card-header>
        <mat-card-title>
          <h2>Forgot Password</h2>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <mat-form-field class="w-100">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email" required>
              <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('required')">
                Email is required.
              </mat-error>
              <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('email') && !forgotPasswordForm.get('email')?.hasError('required')">
                Please enter a valid email address.
              </mat-error>
            </mat-form-field>
          </div>
          <div class="form-group text-center mt-3">
            <button mat-raised-button color="primary" type="submit" [disabled]="!forgotPasswordForm.valid">Send Reset Link</button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
