<div class="reset-password-container d-flex justify-content-center align-items-center">
  <div class="reset-password-content">
    <mat-card>
      <mat-card-header>
        <mat-card-title>
          <h2>Reset Password</h2>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <mat-form-field class="w-100">
              <mat-label>New Password</mat-label>
              <input matInput [type]="hideNewPassword ? 'password' : 'text'" formControlName="newPassword" required>
              <button type="button" matSuffix (click)="toggleNewPasswordVisibility()" class="border-none"
                [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hideNewPassword">
                <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
              <mat-error
                *ngIf="resetPasswordForm.get('newPassword')?.hasError('required') && (resetPasswordForm.get('newPassword')?.touched || resetPasswordForm.get('newPassword')?.dirty)">
                New password is required.
              </mat-error>
              <mat-error
                *ngIf="resetPasswordForm.get('newPassword')?.hasError('minlength') && (resetPasswordForm.get('newPassword')?.touched || resetPasswordForm.get('newPassword')?.dirty)">
                Password must be at least 8 characters long.
              </mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field class="w-100">
              <mat-label>Confirm Password</mat-label>
              <input matInput [type]="hideConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword"
                required>
              <button type="button" mat-icon-button matSuffix (click)="toggleConfirmPasswordVisibility()"
                [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hideConfirmPassword">
                <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
              <mat-error
                *ngIf="resetPasswordForm.get('confirmPassword')?.hasError('required') && (resetPasswordForm.get('confirmPassword')?.touched || resetPasswordForm.get('confirmPassword')?.dirty)">
                Confirm password is required.
              </mat-error>
              <mat-error
                *ngIf="resetPasswordForm.get('confirmPassword')?.hasError('mismatch') && (resetPasswordForm.get('confirmPassword')?.touched || resetPasswordForm.get('confirmPassword')?.dirty)">
                Passwords do not match.
              </mat-error>
            </mat-form-field>
          </div>
          <div class="form-group text-center mt-3">
            <button mat-raised-button color="primary" type="submit" [disabled]="!resetPasswordForm.valid">Reset</button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
