<div class="category-form">
  <h2>{{ isEditMode ? 'Edit Category' : 'Create Category' }}</h2>
  <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
    <mat-form-field class="full-width">
      <mat-label>Name</mat-label>
      <input
        matInput
        formControlName="name"
        [ngClass]="{ 'is-invalid': categoryForm.get('name')?.invalid && (categoryForm.get('name')?.touched || categoryForm.get('name')?.dirty) }"
      />
      <mat-error *ngIf="categoryForm.get('name')?.invalid && (categoryForm.get('name')?.touched || categoryForm.get('name')?.dirty)">
        Name is required.
      </mat-error>
    </mat-form-field>
    <div class="buttons">
      <button mat-raised-button type="submit" color="primary" [disabled]="categoryForm.invalid">{{ isEditMode ? 'Update' : 'Create' }}</button>
      <button mat-raised-button routerLink="/categories" color="accent">Cancel</button>
    </div>
  </form>
</div>
