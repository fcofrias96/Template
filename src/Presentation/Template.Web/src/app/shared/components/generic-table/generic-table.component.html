<table class="table table-striped">
  <thead>
    <tr>
      <th *ngFor="let column of columns">
        <div class="d-flex align-items-center">
          <span
            (click)="column.sortable ? sortBy(column.key) : null"
            [style.cursor]="column.sortable ? 'pointer' : 'default'"
          >
            {{ column.title }}
            <i
              *ngIf="sortColumn === column.key"
              class="bi"
              [ngClass]="{
                'bi-arrow-up': sortDirection === 'asc',
                'bi-arrow-down': sortDirection === 'desc'
              }"
            ></i>
          </span>
        </div>
        <div *ngIf="column.filterable">
          <input
            type="text"
            class="form-control form-control-sm"
            (input)="onFilterChange(column.key, $event)"
            placeholder="Filter"
          />
        </div>
      </th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of displayedData">
      <td *ngFor="let column of columns">
        {{ item[column.key] }}
      </td>
      <td>
        <!-- Botones de acciones -->
        <button class="btn btn-sm btn-primary me-1" (click)="onEditClick(item)">
          <i class="bi bi-pencil"></i>
        </button>
        <button class="btn btn-sm btn-danger" (click)="onDeleteClick(item)">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>
  </tbody>
</table>

<!-- Paginación -->
<nav aria-label="Page navigation">
  <ul class="pagination">
    <li class="page-item" [class.disabled]="currentPage === 1">
      <a class="page-link" (click)="goToPage(currentPage - 1)" aria-label="Previous">
        <span aria-hidden="true">&laquo;</span>
      </a>
    </li>

    <li
      class="page-item"
      *ngFor="let page of [].constructor(totalPages); let i = index"
      [class.active]="currentPage === i + 1"
    >
      <a class="page-link" (click)="goToPage(i + 1)">{{ i + 1 }}</a>
    </li>

    <li class="page-item" [class.disabled]="currentPage === totalPages">
      <a class="page-link" (click)="goToPage(currentPage + 1)" aria-label="Next">
        <span aria-hidden="true">&raquo;</span>
      </a>
    </li>
  </ul>
</nav>
