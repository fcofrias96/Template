<table class="table table-striped">
  <thead>
    <tr>
      <th *ngFor="let column of columns">
        <div class="d-flex align-items-center">
          <button
            (click)="column.sortable ? sortBy(column.key) : null"
            [style.cursor]="column.sortable ? 'pointer' : 'default'"
          >
            {{ column.title }}
            <i
              *ngIf="sortColumn === column.key"
              class="bi"
              [ngClass]="{
                'bi-arrow-up': sortDirection === 'asc',
                'bi-arrow-down': sortDirection === 'desc'
              }"
            ></i>
          </button>
        </div>
        <div *ngIf="column.filterable">
          <ng-container [ngSwitch]="column.filterType">
            <div *ngSwitchCase="'number'">
              <input
                type="text"
                placeholder="min"
                (input)="onNumberFilterChange(column.key, $event, 'start')"
              />
              <input
                type="text"
                placeholder="max"
                (input)="onNumberFilterChange(column.key, $event, 'end')"
              />
            </div>
            <div *ngSwitchCase="'date'">
              <input type="date" />
              <input type="date" />
            </div>
            <div *ngSwitchDefault>
              <input
                type="text"
                class="form-control form-control-sm"
                (input)="onFilterChange(column.key, $event)"
                placeholder="Filter"
              />
            </div>
          </ng-container>
        </div>
      </th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of data?.elements">
      <td *ngFor="let column of columns">
        {{ item[column.key] }}
      </td>
      <td>
        <!-- Botones de acciones -->
        <button class="btn btn-sm btn-primary me-1" (click)="onEditClick(item)">
          <i class="bi bi-pencil"></i>
        </button>
        <button class="btn btn-sm btn-danger" (click)="onDeleteClick(item)">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>
  </tbody>
</table>

<!-- Paginación -->
<nav aria-label="Page navigation">
  <ul class="pagination">
    <li class="page-item" [class.disabled]="1 === 1">
      <button class="page-link" (click)="GoPrevious()" aria-label="Previous">
        <span aria-hidden="true">&laquo;</span>
      </button>
    </li>

    <li
      class="page-item"
      *ngFor="let page of [].constructor(totalPages); let i = index"
      [class.active]="currentPage === i + 1"
    >
      <button class="page-link" (click)="goToPage(i + 1)">{{ i + 1 }}</button>
    </li>

    <li class="page-item" [class.disabled]="currentPage === totalPages">
      <button
        class="page-link"
        (click)="goNext()"
        aria-label="Next"
      >
        <span aria-hidden="true">&raquo;</span>
      </button>
    </li>
  </ul>
</nav>
<app-select
  [options]="itemsPerPageOptions"
  (change)="onItemsPerPageChange($event)"
>
</app-select>
<p>{{data?.total}}</p>
