<div class="modal-header">
  <h5 class="modal-title">{{ title }}</h5>
  <button class="bi bi-x-lg" (click)="close()"></button>
</div>
<div class="modal-body">
  <div class="action">
    <button class="btn btn-primary" (click)="onYesButton()">Yes</button>
    <button class="btn btn-danger" (click)="onNoButton()">No</button>
  </div>
</div>
